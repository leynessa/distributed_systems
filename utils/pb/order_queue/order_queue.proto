// order_queue.proto
syntax = "proto3";

package orderqueue;

service OrderQueueService {
  // Enqueue adds an order to the queue
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse) {}
  
  // Dequeue removes and returns the next order from the queue
  rpc Dequeue(DequeueRequest) returns (DequeueResponse) {}
  
  // GetQueueStatus returns information about the current queue state
  rpc GetQueueStatus(QueueStatusRequest) returns (QueueStatusResponse) {}
}

// For vector clock implementation
message VectorClock {
  map<string, uint64> clock = 1;
}

// Order represents a processed order ready for execution
message Order {
  string orderId = 1;
  string userId = 2;
  UserInfo user = 3;
  repeated OrderItem items = 4;
  BillingAddress billingAddress = 5;
  string shippingMethod = 6;
  bool giftWrapping = 7;
  double totalAmount = 8;
}



message UserInfo {
  string name = 1;
  string contact = 2;
}

message OrderItem {
  string name = 1;
  int32 quantity = 2;
}

message BillingAddress {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip = 4;
  string country = 5;
}

message EnqueueRequest {
  Order order = 1;
  VectorClock vectorClock = 2;
}

message EnqueueResponse {
  bool success = 1;
  string message = 2;
  int32 queuePosition = 3;
  VectorClock vectorClock = 4;
}

message DequeueRequest {
  string executorId = 1;
  VectorClock vectorClock = 2;
}

message DequeueResponse {
  bool success = 1;
  string message = 2;
  Order order = 3;
  VectorClock vectorClock = 4;
}

message QueueStatusRequest {
  VectorClock vectorClock = 1;
}

message QueueStatusResponse {
  int32 queueSize = 1;
  repeated string orderIds = 2;
  VectorClock vectorClock = 3;
}