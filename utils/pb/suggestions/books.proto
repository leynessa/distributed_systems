syntax = "proto3";

package books;

message VectorClock {
  map<string, int32> clock = 1;
}

message BookRequest {
  string orderId = 1;
  VectorClock vectorClock = 2;
}

message Book {
  string title = 1;
  string author = 2;
}

message BookList {
  repeated Book books = 1;
  VectorClock vectorClock = 2;
}

message UpdateClockRequest {
  string orderId = 1;
  VectorClock vectorClock = 2;
}

message UpdateClockResponse {
  VectorClock vectorClock = 1;
}

service BookService {
  rpc GetSuggestions (BookRequest) returns (BookList);
  rpc UpdateClock (UpdateClockRequest) returns (UpdateClockResponse);
}