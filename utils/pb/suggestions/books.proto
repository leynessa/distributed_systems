syntax = "proto3";

package books;

message VectorClock {
  map<string, int32> clock = 1;
}

message BookRequest {
  VectorClock vectorClock = 1; // Додаємо векторний годинник
}

message Book {
  string title = 1;
  string author = 2;
}

message BookList {
  repeated Book books = 1;
  VectorClock vectorClock = 2; // Повертаємо оновлений годинник
}

service BookService {
  rpc GetSuggestions (BookRequest) returns (BookList);
}